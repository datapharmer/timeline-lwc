<template>
    <lightning-card variant="Narrow" class="timeline-card">
        <div slot="title" class="slds-grid slds-grid_vertical-align-center">
            <div class="slds-col">
                <h2 class="slds-card__header-title">
                    {timelineTitle}
                </h2>
            </div>
            <div class="slds-col slds-text-align_right">
                <template if:true={showSummary}>
                    <span class="timeline-summary-verbose slds-p-right_small">{timelineSummaryText}</span>
                </template>
            </div>
        </div>

        <div slot="actions">
            <template if:true={isLoaded}>
                 <lightning-button-icon class="timeline-filter-button" icon-name="utility:filterList" variant="border-filled"
                    alternative-text={label.FILTERS} title={label.FILTERS} onclick={toggleFilter}>
                </lightning-button-icon>
                <lightning-button-icon class="timeline-refresh" icon-name="utility:refresh" variant="border-filled"
                    alternative-text="Refresh" onclick={processTimeline}>
                </lightning-button-icon>
            </template>
        </div>

        <div class="timeline-body slds-card__body slds-card__body_inner">
            <div class={illustrationVisibility}>
                <c-illustration header={illustrationHeader} sub-header={illustrationSubHeader} size="small" type={illustrationType}></c-illustration>
            </div>
            
            <template if:true={isLoading}>
                <div class="slds-is-relative">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
            
            <div class="timeline-main-container">
                <div class="timeline-canvas-axis"></div>
                <div class="timeline-canvas"></div>
                <div class="timeline-canvas-map">
                    <div class="timeline-map-axis"></div>
                    <div class="timeline-map"></div>
                </div>
            </div>
        </div>
    </lightning-card>

    <!-- Tooltip Panel -->
    <div class={tooltipClass} role="dialog" style="visibility: hidden; min-width: 250px; max-width: 400px;">
        <!-- Fallback Tooltip for things like CaseFeed that don't support UI API -->
        <template if:true={showFallbackTooltip}>
            <div>
                <p>{mouseOverPositionValue}</p>
                <lightning-formatted-rich-text value={mouseOverFallbackValue}></lightning-formatted-rich-text>
            </div>
        </template>
        
        <!-- Standard Record Tooltip -->
        <template if:true={showRecordTooltip}>
            <div>
                <template if:true={isTooltipLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                 <lightning-record-form
                    record-id={mouseOverRecordId}
                    object-api-name={mouseOverObjectAPIName}
                    layout-type="Compact"
                    mode="readonly"
                    onload={tooltipLoaded}>
                </lightning-record-form>
            </div>
        </template>
    </div>

    <!-- Filter Panel -->
    <div class="timeline-filter slds-panel slds-size_medium slds-panel_docked slds-panel_docked-right slds-is-hidden"
        aria-hidden="true">
        <div class="slds-panel__header">
            <h2 class="slds-panel__header-title slds-text-heading_small slds-truncate" title={label.FILTERS}>
                {label.FILTERS}
            </h2>
            <button class="slds-button slds-button_icon slds-button_icon-small slds-panel__close" title="Collapse Filter" onclick={toggleFilter}>
                <lightning-icon icon-name="utility:close" alternative-text="Collapse Filter" size="small"></lightning-icon>
                <span class="slds-assistive-text">Collapse Filter</span>
            </button>
        </div>
        <div class="slds-panel__body">
             <fieldset class="slds-form-element">
                <legend class="slds-form-element__legend slds-form-element__label">{label.TYPE_LEGEND}</legend>
                <div class="slds-form-element__control">
                    <div class="slds-checkbox">
                        <input type="checkbox" name="options" class="all-types-checkbox" id="all-types-checkbox" value="all" onchange={handleAllTypesChange}/>
                        <label class="slds-checkbox__label" for="all-types-checkbox">
                            <span class="slds-checkbox_faux"></span>
                            <span class="slds-form-element__label">{label.ALL_TYPES}</span>
                        </label>
                    </div>
                    <lightning-checkbox-group   name="objectFilter"
                                                class="object-filter"
                                                options={filterOptions}
                                                value={filterValues}
                                                onchange={handleFilterChange}>
                    </lightning-checkbox-group>
                </div>
            </fieldset>
        </div>
        <div class="slds-panel__footer">
            <lightning-button label={label.BUTTON_CANCEL} onclick={cancelFilter} class="slds-m-right_small"></lightning-button>
            <lightning-button label={label.BUTTON_APPLY} variant="brand" onclick={applyFilter} disabled={isApplyFilterDisabled}></lightning-button>
        </div>
    </div>
    <!-- Case Comment Edit Modal -->
<template if:true={showCaseCommentModal}>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- Modal Header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseCommentModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="Close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium slds-hyphenate">Edit Case Comment</h2>
            </header>

            <!-- Modal Body with Edit Form -->
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-record-edit-form
                    record-id={caseCommentIdToEdit}
                    object-api-name="CaseComment"
                    onsuccess={handleCommentSaved}
                    onerror={handleCommentError}>
                    
                    <lightning-messages></lightning-messages>
                    
                    <!-- The IsPublished field is required to save a comment -->
                    <lightning-input-field field-name="IsPublished" class="slds-hidden"></lightning-input-field>
                    
                    <lightning-input-field field-name="CommentBody"></lightning-input-field>

                    <!-- Modal Footer with Buttons -->
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={handleCloseCommentModal}>Cancel</button>
                        <button class="slds-button slds-button_brand" type="submit">Save</button>
                    </footer>
                </lightning-record-edit-form>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
</template>
